name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Gerar build
        run: npm run build
